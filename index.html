<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FASTLANE</title>
<meta name="description" content="FASTLANE: allenamenti di nuoto master">
<meta name="theme-color" content="#0C2231">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FASTLANE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: binario laterale (desktop) / barra corsie in basso (telefono); contenuto a schede su fondo "piastrella di vasca"; scala colori andature dal freddo (A1) al caldo (C3). */
:root{
  --bg:#EDF2F5; --surface:#FFFFFF; --surface2:#F4F8FA; --ink:#0C2231; --muted:#5A7181; --line:#D4DFE6;
  --accent:#0B5FA5; --accent-ink:#FFFFFF; --tint:#E3EFF9; --race:#D62839; --ok:#1C8C57; --warn:#B26A00;
  --a1:#6FBDE6; --a2:#2F86C8; --b1:#2E9E68; --b2:#CC9B00; --c1:#E8761F; --c2:#D62839; --c3:#8A2A6B;
  --shadow:0 1px 2px rgba(12,34,49,.06),0 4px 16px rgba(12,34,49,.05);
  --f-disp:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --tabh:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#07141D; --surface:#0E202D; --surface2:#122836; --ink:#E3EDF3; --muted:#8EA5B4; --line:#1E394B;
  --accent:#5DB1F0; --accent-ink:#04121C; --tint:#11324A; --race:#FF5D68; --ok:#3CC783; --warn:#F0A73A;
  --a1:#8DD2F6; --a2:#4FA3E6; --b1:#43C285; --b2:#EFC232; --c1:#FF9448; --c2:#FF5D68; --c3:#D46AB4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07141D; --surface:#0E202D; --surface2:#122836; --ink:#E3EDF3; --muted:#8EA5B4; --line:#1E394B;
  --accent:#5DB1F0; --accent-ink:#04121C; --tint:#11324A; --race:#FF5D68; --ok:#3CC783; --warn:#F0A73A;
  --a1:#8DD2F6; --a2:#4FA3E6; --b1:#43C285; --b2:#EFC232; --c1:#FF9448; --c2:#FF5D68; --c3:#D46AB4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;letter-spacing:.01em;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:2.1rem} h2{font-size:1.45rem} h3{font-size:1.15rem}
p{margin:0}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* App shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:4px;padding:20px 12px 16px max(12px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;flex-direction:column;gap:8px;padding:4px 10px 18px}
.logo{font-family:var(--f-disp);font-weight:800;font-size:1.75rem;letter-spacing:.04em;font-style:italic;line-height:1}
.logo b{color:var(--accent);font-weight:800}
.lane{height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--race) 0 9px,var(--surface) 9px 11px,var(--accent) 11px 20px,var(--surface) 20px 22px,var(--b2) 22px 31px,var(--surface) 31px 33px)}
.navbtn{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;background:none;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;text-align:left;width:100%}
.navbtn svg{width:20px;height:20px;flex:none}
.navbtn:hover{background:var(--surface2);color:var(--ink)}
.navbtn.on{background:var(--tint);color:var(--accent)}
.rail .spacer{flex:1}
.sync{font-size:.75rem;color:var(--muted);padding:8px 12px;display:flex;gap:8px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.cloud i{background:var(--ok)} .sync.demo i{background:var(--b2)}
main{min-width:0;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.tabbar{display:none}
@media (min-width:861px){main{padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  main{padding-block:14px calc(var(--tabh) + 28px)}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:4px max(4px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(4px,env(safe-area-inset-left,0px))}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:.66rem;font-weight:600;padding:7px 0 6px;cursor:pointer;min-width:0}
  .tabbar svg{width:22px;height:22px}
  .tabbar button.on{color:var(--accent)}
  h1{font-size:1.8rem}
}
.mtop{display:none}
.mback{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;font-size:.9rem;border-radius:999px;padding:7px 12px 7px 8px;cursor:pointer;flex-shrink:0}.mback svg{width:18px;height:18px}
@media (max-width:860px){.mtop{display:flex;align-items:center;justify-content:space-between;gap:12px}}

/* Components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:860px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--race)}
.btn.sm{padding:6px 10px;font-size:.82rem;border-radius:8px}
.btn svg{width:16px;height:16px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.icon{border:0;background:none;cursor:pointer;color:var(--muted);width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:1.1rem;flex:none}
.icon:hover{background:var(--surface2);color:var(--ink)}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:.85rem;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:.78rem;font-weight:600;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);min-width:0}
textarea.inp{resize:vertical;min-height:90px;font-family:var(--f-mono);font-size:.85rem;line-height:1.6}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.allmode .field:has(#go-ath),.allmode .field:has(#go-st),.allmode .field:has(#go-main),.allmode .field:has(#go-min),.allmode .field:has(#go-vol),.allmode .field:has(.seg [data-act=gen-by]),.allmode .field:has(.pill){display:none}
.gtag{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 7px;border-radius:999px;font-size:.74rem;font-weight:700;background:color-mix(in srgb,var(--g) 12%,var(--surface));color:color-mix(in srgb,var(--g) 80%,var(--ink));border:1px solid color-mix(in srgb,var(--g) 35%,transparent);white-space:nowrap}.gtag i{width:8px;height:8px;border-radius:50%;background:var(--g)}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.gcard{border-top:5px solid var(--g)!important;display:flex;flex-direction:column;gap:10px}
.gtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.gtile{--g:var(--accent);text-align:left;border:1px solid var(--line);border-left:6px solid var(--g);background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;font:inherit;color:inherit;min-width:0}
.gtile:hover{border-color:var(--g)}
.gtile .gt-h{font-family:var(--f-disp);font-weight:800;font-size:1.15rem;line-height:1.1}
.gtile .gt-s{font-size:.8rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.pill.race{color:var(--race);border-color:color-mix(in srgb,var(--race) 40%,transparent);background:color-mix(in srgb,var(--race) 9%,transparent)}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:color-mix(in srgb,var(--ok) 9%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 9%,transparent)}
.and{--c:var(--muted);display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-family:var(--f-mono);font-size:.74rem;font-weight:600;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);cursor:pointer}
.and::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--c)}
.A1{--c:var(--a1)}.A2{--c:var(--a2)}.B1{--c:var(--b1)}.B2{--c:var(--b2)}.C1{--c:var(--c1)}.C2{--c:var(--c2)}.C3{--c:var(--c3)}
.distbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface2);gap:2px}
.distbar i{display:block;min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--b2) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--b2) 45%,transparent);font-size:.9rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;z-index:70;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (min-width:861px){.toast{bottom:24px}}

/* Hero (Oggi) */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero .lane{position:absolute;left:0;right:0;bottom:0;border-radius:0;height:5px}
.count{display:flex;align-items:center;gap:12px}
.count .big{font-family:var(--f-disp);font-weight:800;font-size:4.4rem;line-height:.85;color:var(--race);font-variant-numeric:tabular-nums}
.count small{font-size:.85rem;color:var(--muted);line-height:1.3;display:block}
.count b{font-family:var(--f-disp);font-size:1.25rem;font-weight:700;color:var(--ink);display:block;line-height:1.1}
@media (max-width:600px){.hero{grid-template-columns:minmax(0,1fr)}.count .big{font-size:3.6rem}}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:700px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.tile .v{font-family:var(--f-disp);font-weight:700;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums;margin-top:6px}
.tile .v small{font-size:1rem;color:var(--muted);font-weight:600;margin-left:3px}
.tile .s{font-size:.78rem;color:var(--muted);margin-top:4px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;cursor:pointer;padding:6px 0;border-radius:10px;min-width:0}
.wd:hover{background:var(--surface2)}
.wd .bar{width:100%;max-width:34px;height:84px;background:var(--surface2);border-radius:8px;display:flex;flex-direction:column-reverse;overflow:hidden;position:relative}
.wd .bar i{display:block}
.wd .bar.plan{background:repeating-linear-gradient(135deg,var(--surface2) 0 5px,var(--line) 5px 7px)}
.wd .l{font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.wd .m{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.wd.today .l{color:var(--accent)}
.wd.today .bar{outline:2px solid var(--accent);outline-offset:2px}
.tips{display:flex;flex-direction:column;gap:10px}
.tip{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;font-size:.9rem}
.tip .ic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--f-disp);background:var(--tint);color:var(--accent)}
.tip.warn .ic{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.tip.ok .ic{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.tip b{display:block}
.ai-out{white-space:pre-wrap;font-size:.9rem;background:var(--surface2);border-radius:10px;padding:12px;margin-top:10px;border:1px solid var(--line)}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li:hover{background:var(--surface2)}
.date-badge{width:46px;text-align:center;border-radius:10px;background:var(--surface2);padding:5px 0;line-height:1.05}
.date-badge b{display:block;font-family:var(--f-disp);font-size:1.35rem}
.date-badge small{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.date-badge.race{background:color-mix(in srgb,var(--race) 12%,transparent);color:var(--race)}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .sub{font-size:.8rem;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;background:none;cursor:pointer;color:transparent;flex:none}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.weekh{display:flex;justify-content:space-between;align-items:baseline;padding:14px 4px 4px;font-size:.8rem;color:var(--muted);font-weight:600;border-bottom:2px solid var(--line)}

/* Editor */
.ed-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.title-in{font-family:var(--f-disp);font-weight:700;font-size:1.7rem;border:0;background:none;padding:2px 0;width:100%;min-width:0;border-bottom:2px dashed transparent}
.title-in:hover,.title-in:focus{border-bottom-color:var(--line);outline:none}
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.block-h{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface2);border-bottom:1px solid var(--line)}
.block-h input{font-family:var(--f-disp);font-weight:700;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;border:0;background:none;flex:1;min-width:0;padding:2px 0}
.block-h .rnd{display:inline-flex;align-items:center;gap:2px;font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.block-h .rnd input{width:42px;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:3px 5px;text-align:center;font-family:var(--f-mono);font-weight:700;font-size:.85rem}
.rgroup{margin:8px 10px 10px;border:2px solid var(--accent);border-radius:12px;overflow:hidden;background:color-mix(in srgb,var(--accent) 4%,var(--surface))}
.rgroup .row:last-child{border-bottom:0}
.rbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--tint);color:var(--ink);font-size:.86rem;border-bottom:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.rbar .rx{font-family:var(--f-disp);font-weight:800;font-size:1.7rem;line-height:1;color:var(--accent);flex:none}
.block-h .rnd{font-family:var(--f-body)!important;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;gap:5px!important}
@media (max-width:600px){.block-h{flex-wrap:wrap}.block-h input[data-bk="name"]{flex:1 1 100%}}
.block-h .m{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);white-space:nowrap}
.row{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);position:relative}
.row::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--c,transparent)}
.r-main{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.r-main input,.r-main select,.r-sub input{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 7px;min-width:0}
.r-main .n{width:52px;text-align:right;font-family:var(--f-mono);font-weight:600}
.r-main .d{width:64px}
.r-main .x{color:var(--muted);font-weight:700}
.r-main select{padding-right:4px}
.r-main select.andsel{font-family:var(--f-mono);font-weight:600;background:color-mix(in srgb,var(--c,var(--line)) 18%,var(--surface));border-color:color-mix(in srgb,var(--c,var(--line)) 55%,transparent)}
.send{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-mono);color:var(--muted);font-weight:600}

<script>
"use strict";
/* ================= Utilità ================= */
const $=(s,r=document)=>r.querySelector(s);

const pad=n=>String(n).padStart(2,'0');

const today=()=>isoOf(new Date());
const addDays=(s,n)=>{const d=toD(s);d.setDate(d.getDate()+n);return isoOf(d)};
const diffDays=(a,b)=>Math.round((toD(b)-toD(a))/864e5);
const wdIdx=s=>(toD(s).getDay()+6)%7;
const weekStart=s=>addDays(s,-wdIdx(s));
const clone=o=>JSON.parse(JSON.stringify(o));

function applySnap(snap){
  if(pendingW>0){lastSnap=snap;return}
  if(snap.empty){
    if(snap.metadata&&snap.metadata.fromCache)return;
    mode='cloud';setSync();
    if(!demo&&hasData(S))persistAll();
    return;
  }
  const ns={settings:{...DEFSET},athletes:[],workouts:[],races:[],favs:[],groups:[]};
  snap.docs.forEach(d=>{const raw=d.data();if(!raw)return;const v=clone(raw);if(d.id==='profile'){ns.settings={...DEFSET,...(v.settings||{})};ns.athletes=v.athletes||[];ns.favs=v.favs||[];ns.groups=v.groups||[]}else if(d.id.startsWith('w-'))ns.workouts.push(v);else if(d.id.startsWith('r-'))ns.races.push(v)});
  mode='cloud';
  if(demo&&!hasData(ns)){setSync();return}
  demo=false;S=ns;STYV++;lsSave();setSync();if(V.tour!=null&&hasData(ns)){V.tour=null;$('#tour').hidden=true}safeRender();
}

function t100raw(T,st){

function eqRowWhy(e,r,ph){const a=r.and||'A1',k=r.kind||'N';const tq=techOf(r);

/* tempo di nuotata: ritmo dell'andatura × tipo di lavoro × attrezzi × lentezza tipica dell'esercizio tecnico (remate, gambe sul fianco…) */
function workTime(ath,r){const d=+r.dist;if(!d)return null;const a=r.and||'A1';const tq=r.tec&&TECHBY[r.tec];const p=t100x(ath,r.st||'SL')/PCT[a]*(KMUL[r.kind||'N']||1)*eqMul(r)*((tq&&tq.k)||1);const f=d>=100?1+0.025*Math.log2(d/100):1-0.02*Math.log2(100/d);return p*d/100*f}

function sendoff(work,and,rf){rf=rf||1;const m=['B2','C1','C2'].includes(and)?rf:(and==='B1'||and==='C3')?1+(rf-1)/2:1;const rest=Math.max(RESTMIN[and]||5,work*(RESTF[and]||.15))*m;const raw=work+rest;const step=raw>120?10:5;return Math.ceil(raw/step)*step}
function autoSend(r,ath){if(!r.and||!r.dist||!(+r.reps))return null;if(+r.reps===1&&(r.and==='A1'||+r.dist>=400))return null;const rf=(ath&&ath._rf)||1;const tq=r.tec&&TECHBY[r.tec];

  /* righe con recupero fisso (ritmo gara a ripetute brevi, spezzati, sopra/sotto soglia) */
  if(r.rs){const wt=workTime(ath,r);return wt?Math.ceil((wt+r.rs*rf)/5)*5:null}

function goalRace(date,goalId){

  const fut=S.races.filter(r=>r.date>=date).sort((a,b)=>a.date<b.date?-1:1);
  return fut.find(r=>r.imp==='A')||fut.find(r=>r.imp==='B')||null}
function phaseAt(date,goalId){
  const race=goalRace(date,goalId);

  const days=diffDays(date,race.date);
  let ph=PHASES.find(p=>days>=p.from&&days<=p.to)||PHASES[PHASES.length-1];
  if(days>21){const recent=S.races.filter(r=>r.date<date&&(r.imp==='A'||r.imp==='B')&&diffDays(r.date,date)<=4);if(recent.length)ph=POST}

  if(d==null){return{st,txt:(base||I.scopo)+' Senza una gara obiettivo non è possibile valutarne il momento migliore.'}}

  if(st==='si'){let t=(base||I.scopo)+' '+resid;if(d*24<I.recH+24&&d>0)t+=` Attenzione: la fatica si smaltisce in circa ${I.recH} ore, tieni il volume molto basso.`;return{st,txt:t}}

const TECHBY=Object.fromEntries(TECH.map(t=>[t.id,t]));
const TCAT={drill:"Esercizi di nuotata",virata:"Virate",partenza:"Partenze"};
function techOf(r){if(!r)return null;if(r.tec&&TECHBY[r.tec])return TECHBY[r.tec];if(r.kind!=='T'||!r.note)return null;const n=r.note.toLowerCase();return TECH.find(t=>n.startsWith(t.name.toLowerCase()))||null}
function techFor(cat,st){const s=st==='ST'?'SL':st;return TECH.filter(t=>t.cat===cat&&(t.st.includes(s)||(s==='MX'&&t.st.includes('MX'))))}
function recentTec(date,extra){const s=new Set(extra||[]);const from=addDays(date,-10);for(const w of S.workouts)if(w.date>=from&&w.date<date)for(const b of w.blocks)for(const r of b.rows)if(r.tec)s.add(r.tec);return s}
function pickTech(list,recent){if(!list.length)return null;const fresh=list.filter(t=>!recent.has(t.id));return pick(fresh.length?fresh:list)}
/* riga di tecnica pronta per la seduta */
function techRow(t,st,and,extra){const d=t.dose||{reps:4,dist:25};const s=st==='ST'?'SL':st;const rs=t.st.includes(s)||s==='MX'?s:t.st[0];
  let note=t.name;if(t.cat==='drill'&&d.split)note=`25 ${t.name.toLowerCase()} + 25 nuotato`;
  if(t.cat==='virata')note+=': parti da metà vasca, virata, esci fino a 10 m';
  if(t.cat==='partenza')note+=and==='C3'?' + 15 m veloci, poi sciolto':' · esecuzione tecnica, poi sciolto';
  const r=R(d.reps,d.dist,rs,'T',and||'A1',note+(extra||''));r.tec=t.id;return r}
/* blocco tecnica: uno o due esercizi dello stile della seduta */
function tecRows(st,vol,myDrill,recent){const s=st==='ST'?'SL':st;const rows=[];
  if(myDrill)rows.push(R(vol>=3000?6:4,50,s,'T','A1',myDrill));
  const l=techFor('drill',s);const t1=pickTech(l,recent);if(t1){rows.push(techRow(t1,s,'A1'));recent=new Set([...recent,t1.id])}
  if(vol>=3000&&rows.length<2){const t2=pickTech(l,recent);if(t2&&(!t1||t2.id!==t1.id))rows.push(techRow(t2,s,'A1'))}
  return rows}
/* blocco virate e partenze: quando e quanto dipende dalla fase */
const SKP={generale:[.65,.2],fondamentale:[.65,.3],nogoal:[.6,.3],recupero:[.5,.2],specifico:[.75,.5],rifinitura:[.9,.65],scarico:[1,.75],attivazione:[1,.85],gara:[0,0]};
function skillBlock(st,ph,intense,recent,force,spec){const P0=SKP[ph.k]||[.6,.3];const P=spec==='vel'?[Math.min(1,P0[0]+.2),Math.min(.85,P0[1]+.25)]:spec==='fondo'?[P0[0],P0[1]*.4]:P0;let mode=force||null;
  if(!mode){if(Math.random()>P[0])return null;mode=Math.random()<P[1]?'partenze':'virate';if(['rifinitura','scarico','attivazione'].includes(ph.k)&&Math.random()<.35)mode='entrambi'}
  if(mode==='none')return null;
  const s=st==='ST'?'SL':st;const c3=ph.no.indexOf('C3')<0&&mixOk([...new Set([...intense,'C3'])].filter(INT));
  const late=['rifinitura','scarico','attivazione'].includes(ph.k);const rows=[];
  if(mode==='virate'||mode==='entrambi'){const t=pickTech(techFor('virata',s).filter(x=>!(x.lvl==='base'&&Math.random()<.6)),recent)||pickTech(techFor('virata',s),recent);if(t)rows.push(techRow(t,s,late&&c3?'C3':'A2',late&&c3?' · 5 m prima e dopo il muro a velocità gara':''))}
  if(mode==='partenze'||mode==='entrambi'){const t=pickTech(techFor('partenza',s),recent);if(t)rows.push(techRow(t,s,c3?'C3':'A2'))}
  if(!rows.length)return null;
  return{id:uid8(),name:mode==='partenze'?'Partenze':mode==='virate'?'Virate':'Virate e partenze',rounds:1,rows,skill:1}}

const ST_AL={sl:'SL',stile:'SL',crawl:'SL',free:'SL',fr:'SL',do:'DO',dorso:'DO',back:'DO',ra:'RA',rana:'RA',df:'DF',fa:'DF',delfino:'DF',farfalla:'DF',fly:'DF',mx:'MX',mi:'MX',misti:'MX',im:'MX',scelta:'ST',st:'ST'};
const KI_AL={gb:'G',gambe:'G',kick:'G',br:'B',braccia:'B',tec:'T',tecnica:'T',drill:'T'};
const EQ_AL={pull:'PB',pb:'PB',pullbuoy:'PB','pull-buoy':'PB',tav:'TV',tavoletta:'TV',pinne:'PN',pn:'PN',palette:'PL',pal:'PL',boccaglio:'BC',bocc:'BC',snorkel:'BC'};
function parseQuick(txt,ath){
  const blocks=[];let cur=null;const nb=n=>{cur={id:uid8(),name:n,rows:[]};blocks.push(cur)};
  for(let line of txt.split('\n')){line=line.trim();if(!line)continue;
    const m=line.match(/^(\d+)\s*[x×]\s*(\d+)(?:\s*[x×]\s*(\d+))?|^(\d+)(?=\s|$|m\b)/i);
    if(!m){let nm=line.replace(/^#+\s*/,'').replace(/:$/,'').replace(/\s*\([^)]*\)\s*$/,'').trim();let rd=1;const mm=nm.match(/^(.*?)\s*[x×]\s*(\d+)$/i);if(mm){nm=mm[1].trim()||'Serie';rd=Math.max(1,+mm[2])}nb(nm);cur.rounds=rd;continue}
    let reps,dist;if(m[4]){reps=1;dist=+m[4]}else if(m[3]){reps=+m[1]*+m[2];dist=+m[3]}else{reps=+m[1];dist=+m[2]}
    const r={id:uid8(),reps,dist,st:'SL',kind:'N',and:null,send:null,note:''};const notes=[];
    for(const tok of line.slice(m[0].length).trim().split(/\s+/)){if(!tok)continue;const t=tok.toLowerCase().replace(/[,;]$/,'');
      if(/^[abc][123]$/.test(t))r.and=t.toUpperCase();
      else if(t[0]==='@'){const s=parseSend(t.slice(1));if(s)r.send=s;else notes.push(tok)}
      else if(t==='m'&&!notes.length){}
      else if(ST_AL[t]&&r.st==='SL'&&!r._st){r.st=ST_AL[t];r._st=1}
      else if(KI_AL[t]&&r.kind==='N')r.kind=KI_AL[t];
      else if(EQ_AL[t]){const e=EQ_AL[t];r.eq=r.eq||[];if(!r.eq.includes(e))r.eq.push(e);if(e==='PB'&&r.kind==='N')r.kind='B';if(e==='TV'&&r.kind==='N')r.kind='G'}
      else notes.push(tok)}
    delete r._st;if(!r.and)r.and=r.kind==='T'?'A1':'A1';r.note=notes.join(' ');
    if(!cur)nb('Serie');cur.rows.push(r)}
  return blocks}
const KCODE={N:'',G:'gambe',B:'braccia',T:'tecnica'};
function rowText(r){return [(+r.reps>1?r.reps+'x':'')+r.dist,ST_SHORT[r.st]||'',KCODE[r.kind]||'',...(r.eq||[]).map(e=>EQ[e].s),r.and||'',r.send?'@'+fmtSend(r.send):'',r.note||''].filter(Boolean).join(' ')}
function wText(w){return w.blocks.map(b=>{const rd=+b.rounds||1;return rd>1?`${b.name.toUpperCase()} x${rd} (${rd} giri da ${rowsM(b.rows)} m = ${blockM(b)} m):\n`+b.rows.map(r=>'  '+rowText(r)).join('\n'):b.name.toUpperCase()+':\n'+b.rows.map(rowText).join('\n')}).join('\n\n')}

function tips(){
  const t=today(),pi=phaseAt(t),out=[];
  if(!pi.race)out.push({k:'warn',t:'Manca la gara obiettivo',d:'Inserisci in calendario la gara più importante (A): fasi, andature consigliate e generatore si adattano alla distanza da essa.'});
  else out.push({t:`${pi.ph.name}: ${pi.days} giorni a ${esc(pi.race.name)}`,d:pi.ph.desc});
  {const nx=S.races.filter(r=>r.date>=t&&!(pi.race&&r.id===pi.race.id)).sort((a,b)=>a.date<b.date?-1:1)[0];const dd=nx?diffDays(t,nx.date):99;
   if(dd<=3)out.push({k:dd<=1?'warn':'',t:dd===0?`Oggi in gara: ${esc(nx.name)}`:`${esc(nx.name)} tra ${dd} ${dd===1?'giorno':'giorni'}`,d:dd===0?'Riscaldamento di 600–1.000 m: sciolto, progressivi, 2–3 partenze a ritmo gara. Tra una gara e l\'altra nuota sciolto, se la vasca lo permette.':dd===1?'Vigilia: seduta breve con sciolto, 4–6 partenze e qualche sprint di 15 m con recupero completo. Niente lavori lattacidi.':'Fino alla gara niente lavori duri (B2, C1, C2): aerobico, tecnica e velocità breve.'})}
  const ws=weekStart(t);const cur=sumDone(ws,addDays(ws,6)).m+S.workouts.filter(w=>!w.done&&w.date>=t&&w.date<=addDays(ws,6)).reduce((s,w)=>s+wMeters(w),0);
  const prev=[1,2,3].map(i=>sumDone(addDays(ws,-7*i),addDays(ws,-7*i+6)).m);const avg=prev.reduce((a,b)=>a+b,0)/3;
  const LW=prof(S.settings.ath);const peak=Math.max(...prev);if(peak>0&&cur>peak*LW.warnUp&&!['scarico','attivazione'].includes(pi.ph.k))out.push({k:'warn',t:'Volume in forte crescita',d:`Questa settimana sono previsti ${km(cur)} km, oltre il ${Math.round((LW.warnUp-1)*100)}% in più della settimana più carica delle ultime tre (${km(peak)} km). Per un master conviene crescere al massimo del 10% a settimana.`});
  if(['scarico','attivazione'].includes(pi.ph.k)&&avg>0&&cur>avg*0.75)out.push({k:'warn',t:'Riduci il volume',d:`Nello scarico il volume deve scendere del 30–60%: punta a circa ${km(avg*0.55)} km questa settimana, mantenendo qualche ripetuta a ritmo gara.`});
  const from=addDays(t,-14);const dist={};let tot=0;for(const w of S.workouts)if(w.done&&w.date>=from&&w.date<=t){const o=wByAnd(w);for(const k in o){dist[k]=(dist[k]||0)+o[k];tot+=o[k]}}
  if(tot>0){const hi=((dist.B2||0)+(dist.C1||0)+(dist.C2||0))/tot;
    if(['generale','fondamentale','nogoal'].includes(pi.ph.k)&&hi>0.15)out.push({k:'warn',t:'Troppa intensità per la fase',d:`Negli ultimi 14 giorni il ${Math.round(hi*100)}% del volume è stato B2/C1/C2. In questa fase tienilo sotto il 10–15% e spingi su A2 e B1.`});
    if(pi.ph.k==='specifico'&&hi<0.06)out.push({t:'Inserisci lavori specifici',d:'Nella preparazione specifica servono 1–2 sedute a settimana con serie B2 o C1: il generatore le propone in automatico.'});
    if(!dist.C3&&pi.ph.si.includes('C3'))out.push({t:'Manca la velocità',d:'Da due settimane non fai lavori C3: bastano 6–8x25 sprint con recupero completo a fine seduta.'})}
  const done=S.workouts.filter(w=>w.done&&w.date<=t).sort((a,b)=>a.date<b.date?1:-1).slice(0,2);
  if(done.length===2&&done.every(w=>['C1','C2'].includes(wMain(w)))&&diffDays(done[0].date,t)<=1)out.push({k:'warn',t:'Due sedute lattacide di fila',d:'Oggi conviene una seduta A1–A2 con tecnica: il sistema lattacido ha bisogno di 48–72 ore per recuperare.'});
  {const near=S.workouts.filter(w=>w.date>=addDays(t,-14)&&w.date<=addDays(t,7));const has=c=>near.some(w=>w.blocks.some(b=>b.rows.some(r=>{const q=techOf(r);return q&&q.cat===c})));
   if(near.length>=2&&!has('virata'))out.push({t:'Allena le virate',d:'Nelle ultime due settimane non ci sono lavori sulle virate: per un master sono secondi guadagnati in ogni gara. Aggiungile dall\'editor con «Tecnica, virate, partenze».'});
   if(pi.race&&pi.days<=21&&pi.days>0&&!has('partenza'))out.push({t:'Prova le partenze',d:'A meno di tre settimane dalla gara inserisci 4–6 partenze (dal blocco o dall\'acqua) dopo il riscaldamento.'});
   const P=prof(S.settings.ath);if(P.age>=55)out.push({t:'Recupero più lungo',d:`Nella fascia ${P.name} servono almeno 48 ore tra due sedute dure (B2, C1, C2): il generatore le distanzia da solo e allunga i recuperi.`})}
  if(out.length<3)out.push({k:'ok',t:'Regola d\'oro',d:'Alterna giorni duri e leggeri: dopo B2, C1 o C2 programma una seduta aerobica o tecnica.'});
  return out.slice(0,5)}

function vSedute(){
  const t=today();let ws=[...WF()];
  if(V.sedF==='prossime')ws=ws.filter(w=>w.date>=t).sort((a,b)=>a.date<b.date?-1:1);
  else if(V.sedF==='passate')ws=ws.filter(w=>w.date<t).sort((a,b)=>a.date<b.date?1:-1);
  else ws.sort((a,b)=>a.date<b.date?1:-1);
  const q=V.sedQ.trim().toLowerCase();if(q)ws=ws.filter(w=>(w.title||'').toLowerCase().includes(q)||wText(w).toLowerCase().includes(q));
  V._visible=ws.map(w=>w.id);
  const groups=[];for(const w of ws){const k=weekStart(w.date);let g=groups.find(x=>x.k===k);if(!g){g={k,ws:[]};groups.push(g)}g.ws.push(w)}
  const sm=V.selMode,sel=V.sel||(V.sel=new Set());const nSel=[...sel].filter(id=>S.workouts.some(w=>w.id===id)).length;
  const selBar=sm?`<div class="selbar"><b>${nSel} ${nSel===1?'seduta selezionata':'sedute selezionate'}</b><div class="btns"><button class="btn sm" data-act="sel-all">${ws.length&&ws.every(w=>sel.has(w.id))?'Deseleziona tutte':'Seleziona tutte ('+ws.length+')'}</button><button class="btn sm" data-act="sel-off">Annulla</button><button class="btn sm pri" style="background:var(--race);border-color:var(--race)" data-act="sel-del" ${nSel?'':'disabled'}>Elimina ${nSel||''}</button></div></div>`:'';
  return `<div class="card-h"><h1>Sedute</h1><div class="btns">${sm?'':`<button class="btn" data-act="sel-on">Seleziona</button><button class="btn" data-act="bulk">Gestisci</button><button class="btn" data-act="nav" data-v="genera">${IC.genera} Genera</button>`}<button class="btn pri" data-act="new-w" data-date="${t}">${IC.plus} Nuova seduta</button></div></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><div class="seg">${[['prossime','In programma'],['passate','Passate'],['tutte','Tutte']].map(([k,l])=>`<button class="${V.sedF===k?'on':''}" data-act="sed-f" data-k="${k}">${l}</button>`).join('')}</div>
  ${grpFilter()}<input class="inp" id="sedq" data-bind="sedQ" placeholder="Cerca (es. B2, delfino, 200)" value="${esc(V.sedQ)}" style="max-width:280px"></div>
  ${selBar}
  <div class="card" style="padding:4px 14px 10px">${groups.length?groups.map(g=>`<div class="weekh"><span>Settimana dal ${fmtD(g.k)}</span><span class="btns" style="align-items:center"><span class="num">${km(g.ws.reduce((s,w)=>s+wMeters(w),0))} km</span>${sm?`<button class="btn sm ghost" data-act="sel-week" data-k="${g.k}">${g.ws.every(w=>sel.has(w.id))?'Deseleziona settimana':'Seleziona settimana'}</button>`:''}</span></div><div class="list">${g.ws.map(w=>sm?selLi(w,sel.has(w.id)):wLi(w)).join('')}</div>`).join(''):`<div class="empty" style="margin:12px 0">Nessuna seduta ${V.sedF==='passate'?'passata':'in programma'}.<button class="btn pri" data-act="new-w" data-date="${t}">${IC.plus} Scrivi la prima</button></div>`}</div>`}
function selLi(w,on){const d=toD(w.date),m=wMeters(w),a=wMain(w);

function bulkSheet(){const t=today();const fut=S.workouts.filter(w=>!w.done&&w.date>=t);const gen=S.workouts.filter(w=>w.gen&&!w.done);
  const progs={};gen.forEach(w=>{const p=progs[w.gen]||(progs[w.gen]={n:0,from:w.date,to:w.date,m:0});p.n++;p.m+=wMeters(w);if(w.date<p.from)p.from=w.date;if(w.date>p.to)p.to=w.date});

   ${Object.entries(progs).sort((a,b)=>a[1].from<b[1].from?-1:1).map(([id,p])=>row('bulk-prog',`Programmazione dal ${fmtD(p.from)} al ${fmtD(p.to)}`,`${p.n} sedute non ancora svolte · ${km(p.m)} km`,p.n,`data-id="${id}"`)).join('')}
   ${row('bulk-future','Tutte le sedute in programma da oggi',`Sedute non svolte, scritte o generate · ${km(fut.reduce((s,w)=>s+wMeters(w),0))} km`,fut.length)}

function whyBox(w){const pi=phaseAt(w.date,wGoal(w));const o=wByAnd(w);const list=ANDS.filter(a=>o[a]);if(!list.length)return '<span class="muted">Aggiungi delle serie per vedere la spiegazione.</span>';const I=list.filter(INT);const warn=(I.includes('C1')&&I.includes('C2'))?'C1 e C2 nella stessa seduta: meglio dividerle in sedute diverse, ognuna richiede 48–72 ore di recupero.':I.length>2?`Ci sono ${I.length} andature intense (${I.join(', ')}): con più di due la seduta perde un obiettivo chiaro.`:'';const longF=[...new Set(w.blocks.flatMap(b=>b.rows).filter(tooLong).map(r=>r.and))];const lcBad=+w.pool===50&&w.blocks.some(b=>b.rows.some(r=>+r.dist&&+r.dist%50));const W=[warn,longF.length?`Ripetute troppo lunghe in ${longF.join(', ')}: B2, C1 e C2 al massimo 100 m, C3 al massimo 50 m (es. 2×100 diventa 4×50).`:'',lcBad?'Vasca da 50 m: alcune distanze non finiscono al muro (es. 25 o 75). Cambia vasca e torna a 50 per adattarle in automatico.':'',...eqWarnings(w)].filter(Boolean).map(x=>`<div class="tip warn"><span class="ic">!</span><div>${x}</div></div>`).join('');

function niceMax(v){const s=[2,4,5,6,8,10,12,15,20,25,30,40,50,60,80,100,120,150,200,250,300];const k=v/1000;return (s.find(x=>x>=k)||Math.ceil(k/50)*50)*1000}
function bars(data){
  const n=data.length,bw=n>8?34:44,gap=n>8?10:14,L=40,T=12,H=170,W=L+n*(bw+gap)+gap;
  const mx=niceMax(Math.max(1000,...data.map(x=>Math.max(x.plan,ANDS.reduce((s,a)=>s+(x.segs[a]||0),0)))));
  const y=v=>T+H-v/mx*H;let g='';
  for(let i=0;i<=4;i++){const v=mx*i/4;g+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="JetBrains Mono,monospace">${(v/1000).toLocaleString('it-IT',{maximumFractionDigits:1})}</text>`}
  data.forEach((x,i)=>{const x0=L+gap+i*(bw+gap);if(x.plan){g+=`<rect x="${x0}" y="${y(x.plan)}" width="${bw}" height="${H+T-y(x.plan)}" rx="5" fill="none" stroke="var(--muted)" stroke-dasharray="3 3" opacity=".7"/>`}
    let acc=0;ANDS.forEach(a=>{const v=x.segs[a]||0;if(!v)return;g+=`<rect x="${x0}" y="${y(acc+v)}" width="${bw}" height="${Math.max(1,y(acc)-y(acc+v))}" fill="var(--${a.toLowerCase()})"><title>${x.lab} · ${a}: ${mfmt(v)} m</title></rect>`;acc+=v});
    g+=`<text x="${x0+bw/2}" y="${T+H+16}" text-anchor="middle" font-size="11" fill="${x.hi?'var(--accent)':'var(--muted)'}" font-weight="${x.hi?700:500}">${x.lab}</text>`});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${T+H+26}" role="img" aria-label="Chilometri per periodo">${g}</svg></div>`}
function periodRange(p,a){const d=toD(a);
  if(p==='giorno')return{from:a,to:a,lab:fmtDL(a)};
  if(p==='settimana'){const f=weekStart(a);return{from:f,to:addDays(f,6),lab:`${fmtD(f)} – ${fmtD(addDays(f,6))}`}}
  if(p==='mese'){const f=a.slice(0,8)+'01';const nd=new Date(d.getFullYear(),d.getMonth()+1,0,12);return{from:f,to:isoOf(nd),lab:`${MESI[d.getMonth()]} ${d.getFullYear()}`}}
  const f=seasonStart(a);const y=+f.slice(0,4);return{from:f,to:addDays(`${y+1}${f.slice(4)}`,-1),lab:`Stagione ${y}/${String(y+1).slice(2)}`}}
function segOf(from,to){const segs={};let plan=0;for(const w of S.workouts){if(w.date<from||w.date>to)continue;const m=wMeters(w);plan+=m;if(w.done){const o=wByAnd(w);for(const k in o)segs[k]=(segs[k]||0)+o[k]}}return{segs,plan}}
function vProg(){

  const dist={};done.forEach(w=>{const o=wByAnd(w);for(const k in o)dist[k]=(dist[k]||0)+o[k]});const dtot=Object.values(dist).reduce((x,y)=>x+y,0)||1;
  const dur=done.reduce((s,w)=>s+wDur(w,pa(w)),0);const rpes=done.filter(w=>w.rpe).map(w=>w.rpe);
  let data=[];
  if(p==='settimana')for(let i=0;i<7;i++){const d=addDays(R.from,i);const x=segOf(d,d);data.push({lab:GG[i],...x,hi:d===t})}
  else if(p==='mese'){let s=weekStart(R.from);while(s<=R.to){const e=addDays(s,6);const x=segOf(s<R.from?R.from:s,e>R.to?R.to:e);data.push({lab:`${toD(s<R.from?R.from:s).getDate()}–${toD(e>R.to?R.to:e).getDate()}`,...x,hi:t>=s&&t<=e});s=addDays(s,7)}}
  else if(p==='stagione'){let s=R.from;for(let i=0;i<12;i++){const d=toD(s);const e=isoOf(new Date(d.getFullYear(),d.getMonth()+1,0,12));const x=segOf(s,e);data.push({lab:MESI3[d.getMonth()],...x,hi:t>=s&&t<=e});s=addDays(e,1)}}
  const mains={};done.forEach(w=>{const a2=wMain(w);mains[a2]=(mains[a2]||0)+1});

  const allm=S.workouts.filter(w=>w.done).reduce((s,w)=>s+wMeters(w),0);
  return `${grpFilter()?`<div style="margin-bottom:10px">${grpFilter()}</div>`:''}<div class="card-h"><h1>Progressi</h1><div class="seg">${[['giorno','Giorno'],['settimana','Settimana'],['mese','Mese'],['stagione','Stagione']].map(([k,l])=>`<button class="${p===k?'on':''}" data-act="prog-p" data-k="${k}">${l}</button>`).join('')}</div></div>
  <div style="display:flex;align-items:center;gap:8px"><button class="btn sm" data-act="prog-nav" data-d="-1" aria-label="Periodo precedente">‹</button><h2 style="flex:1;text-align:center">${R.lab}</h2><button class="btn sm" data-act="prog-nav" data-d="1" aria-label="Periodo successivo">›</button></div>
  <div class="tiles">
   <div class="tile"><div class="eyebrow">Percorsi</div><div class="v">${km(dm)}<small>km</small></div><div class="s">${pm>dm?`su ${km(pm)} km in programma`:'tutto il programmato'}</div></div>
   <div class="tile"><div class="eyebrow">Sedute svolte</div><div class="v">${done.length}<small>/ ${ws.length}</small></div><div class="s">${done.length?mfmt(dm/done.length)+' m di media':'—'}</div></div>

   <div class="tile"><div class="eyebrow">Totale di sempre</div><div class="v">${km(allm)}<small>km</small></div><div class="s">${rpes.length?`RPE medio nel periodo ${(rpes.reduce((a,b)=>a+b,0)/rpes.length).toFixed(1).replace('.',',')}`:'tutte le sedute svolte'}</div></div>
  </div>
  ${p==='giorno'?`<div class="card"><div class="card-h"><h2>Sedute del giorno</h2></div>${ws.length?ws.map(w=>wCard(w)).join(''):'<div class="empty">Nessuna seduta in questo giorno.</div>'}</div>`
   :`<div class="card"><div class="card-h"><h2>Chilometri ${p==='settimana'?'per giorno':p==='mese'?'per settimana':'per mese'}</h2><span class="muted" style="font-size:.8rem">barre piene = svolto · tratteggio = in programma</span></div>${bars(data)}${legend(dist)}</div>`}
  <div class="grid2">

  </div>`}

  if(!V.progOpt){const g=goalRace(t);V.progOpt={from:t,goal:g?g.id:'',to:g?addDays(g.date,-1):addDays(t,56),days:[...trainDays()],pool:S.settings.pool||25,vol:myVol||prof(S.settings.ath).vol,by:'min',min:S.settings.minutes||60,ath:S.settings.ath||'',st:'SL',replace:true}}

  const tabs=`<div class="seg"><button class="${V.genTab==='seduta'?'on':''}" data-act="gen-tab" data-k="seduta">Seduta singola</button><button class="${V.genTab==='prog'?'on':''}" data-act="gen-tab" data-k="prog">Programmazione completa</button></div>`;

    return `<div class="card-h"><h1>Genera</h1>${tabs}</div>
    <div class="card"><div class="form${o.group==='_all'?' allmode':''}">
     <label class="field"><span>Data</span><input class="inp" type="date" id="go-date" data-g="date" value="${o.date}"></label>

     ${grps().length?`<label class="field"><span>Corsia / gruppo</span><select class="inp" id="go-grp" data-g="group"><option value="">Nessun gruppo</option>${grps().map(g=>`<option value="${g.id}"${o.group===g.id?' selected':''}>${esc((grpLanes(g)?grpLanes(g)+' · ':'')+grpName(g))}</option>`).join('')}<option value="_all"${o.group==='_all'?' selected':''}>Tutte le corsie (una seduta per gruppo)</option></select></label>`:''}${o.group==='_all'?`<div class="field" style="grid-column:1/-1"><div class="tip" style="margin:0"><span class="ic">i</span><div>Ogni corsia usa la sua specialità, il suo stile, i suoi minuti in vasca e la sua gara obiettivo: le imposti in «Corsie».</div></div></div>`:''}
     <label class="field"><span>Atleta</span><select class="inp" id="go-ath" data-g="ath">${athOpts(o.ath,S.athletes.length?'— atleta predefinito —':'Tempi generici',1)}</select></label>
     <label class="field"><span>Stile principale</span><select class="inp" id="go-st" data-g="st">${opts({SL:'Stile libero',DO:'Dorso',RA:'Rana',DF:'Delfino',MX:'Misti'},o.st)}</select></label>
     <label class="field"><span>Vasca</span><select class="inp" id="go-pool" data-g="pool">${opts({25:'Vasca corta · 25 m',50:'Vasca lunga · 50 m'},String(o.pool||25))}</select></label>
     <label class="field"><span>Andatura della serie centrale</span><select class="inp" id="go-main" data-g="main"><option value="auto">Automatica (dalla fase)</option>${ANDS.map(a=>`<option value="${a}"${o.main===a?' selected':''}>${a} · ${AI[a].nome} · ${STLAB[andStatus(a,pi.ph)].toLowerCase()}</option>`).join('')}</select></label>
     <label class="field"><span>Attrezzi</span><select class="inp" id="go-eq" data-g="eq">${opts({int:'Integrati secondo la fase',sed:'Seduta con attrezzi (forza e tecnica)',no:'Senza attrezzi'},o.eq||'int')}</select></label>
     <div class="field" style="grid-column:1/-1"><span>Imposta la seduta per</span><div class="seg"><button class="${o.by!=='vol'?'on':''}" data-act="gen-by" data-k="min">Tempo in vasca</button><button class="${o.by==='vol'?'on':''}" data-act="gen-by" data-k="vol">Volume</button></div></div>

     :`<label class="field"><span>Tempo in vasca</span><select class="inp" id="go-min" data-g="min">${opts({45:"45'",60:"60'",75:"75'",90:"90'",105:"105'",120:"120'"},String(o.min||S.settings.minutes||60))}</select></label><div class="field"><span>Metri stimati</span><div class="pill" style="align-self:flex-start;padding:7px 11px">≈ ${mfmt(estVol(o,o.min||S.settings.minutes||60))} m per il ritmo dell'atleta</div></div>`}</div>
     <div class="btns" style="margin-top:14px;align-items:center"><button class="btn pri" data-act="gen-run">${IC.genera} ${o.group==='_all'?'Genera una seduta per ogni corsia':pw?'Rigenera':'Genera la seduta'}</button>${grps().length&&o.group!=='_all'?`<button class="btn" data-act="gen-all" data-date="${o.date}">Genera per tutte le corsie</button>`:''}<span class="muted" style="font-size:.85rem">${pi.ph.name}${pi.days!=null?` · ${pi.days} giorni a ${esc(pi.race.name)}`:''}</span></div></div>
    ${V.genAll&&V.genAll.length?`<div class="card"><div class="card-h"><div><div class="eyebrow">${fmtDL(V.genAll[0].date)}</div><h2>${V.genAll.length} sedute, una per corsia</h2></div><button class="btn pri" data-act="gen-save-all">Salva tutte nel calendario</button></div>${V.genAll.map(w=>{const g=grpById(w.group);return `<div class="card flat" style="border-left:6px solid ${g?g.color:'var(--line)'};margin-top:12px"><div class="card-h" style="margin-bottom:4px"><div>${grpTag(g)}<h3 style="margin-top:6px">${esc(w.title)}</h3><div class="muted" style="font-size:.85rem">${mfmt(wMeters(w))} m · circa ${fmtDur(wDur(w,pa(w)))} · ${esc(phaseAt(w.date,wGoal(w)).ph.name)}</div></div></div>${roWorkout(w)}</div>`}).join('')}</div>`:''}${pw?`<div class="card ro"><div class="card-h"><div><div class="eyebrow">${fmtDL(pw.date)}</div><h2>${esc(pw.title)}</h2>${pw.genNote?`<div class="tip warn" style="margin:6px 0"><span class="ic">!</span><div>${esc(pw.genNote)}</div></div>`:''}<div class="muted" style="font-size:.85rem">${mfmt(wMeters(pw))} m · circa ${fmtDur(wDur(pw,pa(pw)))} · ${POOLN[+pw.pool===50?50:25]}${''}</div></div><div class="btns"><button class="btn" data-act="gen-edit">Modifica prima</button><button class="btn pri" data-act="gen-save">Salva nel calendario</button></div></div>
      ${roWorkout(pw)}${lanesCard(pw)}<div style="margin-top:14px">${distBar(wByAnd(pw))}${legend(wByAnd(pw))}</div>
      <div class="why" style="margin-top:16px"><h3>Perché questa seduta</h3>${whyBox(pw)}</div></div>`:''}${styleCard(sty)}`}
  const pp=V.progPrev;const races=S.races.filter(r=>r.date>t).sort((a,b)=>a.date<b.date?-1:1);
  return `<div class="card-h"><h1>Genera</h1>${tabs}</div>
  <div class="card"><p class="muted" style="margin-bottom:14px;font-size:.9rem">Crea tutte le sedute fino alla gara obiettivo. Le fasi (generale, fondamentale, specifica, rifinitura, scarico, attivazione) vengono calcolate a ritroso dalla data della gara. Carico master: ogni 3ª settimana è di scarico (−20%), al massimo una seduta lattacida (C1 o C2) a settimana, almeno 48 ore tra due sedute intense; virate ogni settimana e partenze nelle fasi finali.</p>
   <div class="form">
    <label class="field"><span>Gara obiettivo</span><select class="inp" id="pg-goal" data-p="goal"><option value="">Nessuna (solo date)</option>${races.map(r=>`<option value="${r.id}"${q.goal===r.id?' selected':''}>${esc(r.name)} · ${fmtD(r.date)} (${r.imp})</option>`).join('')}</select></label>
    <label class="field"><span>Dal</span><input class="inp" type="date" id="pg-from" data-p="from" value="${q.from}"></label>
    <label class="field"><span>Al</span><input class="inp" type="date" id="pg-to" data-p="to" value="${q.to}"></label>
    ${grps().length?'':`<div class="field" style="grid-column:1/-1"><div class="tip" style="margin:0"><span class="ic">i</span><div>Con i gruppi di corsia puoi programmare la stagione di ogni corsia, ognuna con la sua specialità e la sua gara. <button class="btn sm" data-act="nav" data-v="corsie" style="margin-left:6px">Crea le corsie</button></div></div></div>`}
    ${grps().length?`<label class="field"><span>Corsia / gruppo</span><select class="inp" id="pg-grp" data-p="group"><option value="">Nessun gruppo</option>${grps().map(g=>`<option value="${g.id}"${q.group===g.id?' selected':''}>${esc((grpLanes(g)?grpLanes(g)+' · ':'')+grpName(g))}</option>`).join('')}<option value="_all"${q.group==='_all'?' selected':''}>Tutte le corsie (ognuna con la sua gara)</option></select></label>`:''}
    <label class="field"><span>Atleta</span><select class="inp" id="pg-ath" data-p="ath">${athOpts(q.ath,S.athletes.length?'— atleta predefinito —':'Tempi generici',1)}</select></label>
    <label class="field"><span>Stile principale</span><select class="inp" id="pg-st" data-p="st">${opts({SL:'Stile libero',DO:'Dorso',RA:'Rana',DF:'Delfino',MX:'Misti'},q.st)}</select></label>
    <label class="field"><span>Vasca</span><select class="inp" id="pg-pool" data-p="pool">${opts({25:'Vasca corta · 25 m',50:'Vasca lunga · 50 m'},String(q.pool||25))}</select></label>
    <label class="field"><span>Attrezzi</span><select class="inp" id="pg-eq" data-p="eq">${opts({int:'Integrati secondo la fase',sed:'Integrati + 1 seduta con attrezzi a settimana',no:'Senza attrezzi'},q.eq||'int')}</select></label>
    <div class="field"><span>Imposta le sedute per</span><div class="seg"><button class="${q.by!=='vol'?'on':''}" data-act="prog-by" data-k="min">Tempo in vasca</button><button class="${q.by==='vol'?'on':''}" data-act="prog-by" data-k="vol">Volume</button></div></div>
    ${q.by==='vol'?`<label class="field"><span>Volume medio per seduta: <b class="num" id="pg-volv">${mfmt(q.vol)} m</b></span><input type="range" class="slider" id="pg-vol" data-p="vol" min="1000" max="5000" step="100" value="${q.vol}"></label>`
    :`<label class="field"><span>Tempo in vasca per seduta</span><select class="inp" id="pg-min" data-p="min">${opts({45:"45'",60:"60'",75:"75'",90:"90'",105:"105'",120:"120'"},String(q.min||S.settings.minutes||60))}</select></label>`}
    <div class="field" style="grid-column:1/-1"><span>Giorni di allenamento</span><div class="seg">${GG.map((g,i)=>`<button class="${q.days.includes(i)?'on':''}" data-act="pg-day" data-i="${i}">${g}</button>`).join('')}</div></div>
    <label style="grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:.9rem"><input type="checkbox" id="pg-rep" data-p="replace" ${q.replace?'checked':''}> Sostituisci le sedute non svolte già presenti nel periodo</label></div>
   <div class="btns" style="margin-top:14px"><button class="btn pri" data-act="prog-run">${IC.genera} Calcola la programmazione</button></div></div>
  ${pp?progPreview(pp):''}${styleCard(sty)}`}
function roundsBar(b){const rd=+b.rounds||1;if(rd<2)return '';return `<div class="rbar"><span class="rx">${rd} ×</span><span>Ripeti <b>${rd} volte</b> il gruppo qui sotto · <span class="num" style="white-space:nowrap">${mfmt(rowsM(b.rows))} m</span> a giro · <b class="num" style="white-space:nowrap">${mfmt(blockM(b))} m</b> in totale</span></div>`}
function roWorkout(w){const ath=pa(w);return w.blocks.map(b=>{const rd=+b.rounds||1;const rows=b.rows.map(r=>`<div class="row ${r.and||''}"><div class="ro-row"><div><span class="main">${esc(rowText({...r,note:''}))}</span>${r.note?` <span class="note">${esc(r.note)}</span>`:''}${techOf(r)?` <button class="icon tinfo" data-act="tec-info" data-id="${techOf(r).id}" aria-label="Come si fa" title="Come si fa">?</button>`:''}</div><span class="tgt">${rowTarget(r,ath)}</span></div></div>`).join('');
  return `<div style="margin-top:12px"><div class="eyebrow" style="margin-bottom:4px">${esc(b.name)} · <span class="num">${mfmt(blockM(b))} m</span>${b.src?` <span class="pill" style="font-size:.68rem;text-transform:none;letter-spacing:0">${esc(b.src)}</span>`:''}</div>${rd>1?`<div class="rgroup">${roundsBar(b)}${rows}</div>`:rows}</div>`}).join('')}
function progPreview(list){
  const wk={};list.forEach(w=>{const k=weekStart(w.date);(wk[k]=wk[k]||[]).push(w)});const keys=Object.keys(wk).sort();
  const tot=list.reduce((s,w)=>s+wMeters(w),0);
  return `<div class="card"><div class="card-h"><div><h2>${list.length} sedute · ${km(tot)} km</h2><div class="muted" style="font-size:.85rem">${keys.length} settimane</div></div><button class="btn pri" data-act="prog-create">Crea la programmazione</button></div>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Settimana</th><th>Fase</th><th class="num">Sedute</th><th class="num">km</th><th>Serie centrali</th></tr></thead><tbody>
  ${keys.map(k=>{const ws=wk[k];const ph=phaseAt(ws[0].date,V.progOpt.goal).ph;return `<tr><td>${fmtD(k)}</td><td><span class="pill" style="border-color:${ph.col}"><i style="width:8px;height:8px;border-radius:50%;background:${ph.col}"></i>${ph.name}</span></td><td class="num">${ws.length}</td><td class="num">${km(ws.reduce((s,w)=>s+wMeters(w),0))}</td><td><span class="btns">${ws.map(w=>andChip(wMain(w),w.date)).join('')}</span></td></tr>`}).join('')}
  </tbody></table></div></div>`}


function styleCard(sty){
  const uv=S.settings.styleUse==null?70:+S.settings.styleUse;const favs=S.favs||[];
  const kd=sty.tot?['G','B','T'].map(k=>`${KINDS[k].toLowerCase()} ${Math.round(sty.kinds[k]/sty.tot*100)}%`).join(' · '):'';
  const dl=ANDS.filter(a=>sty.dist[a]).map(a=>{const e=Object.entries(sty.dist[a]).sort((x,y)=>y[1]-x[1]).slice(0,3).map(x=>x[0]).join(', ');return `<span class="pill">${andChip(a,'')} ${e} m</span>`}).join(' ');
  const nm=Object.entries(sty.names).map(([k,v])=>esc(v)).join(' → ');
  const mineN=Object.values(sty.mains).reduce((x,y)=>x+y.length,0);
  return `<div class="card"><div class="card-h"><div><h2>Il tuo stile</h2><div class="muted" style="font-size:.85rem">FASTLANE impara dalle sedute che scrivi o modifichi: struttura, distanze, nomi dei blocchi, riscaldamenti e serie preferite.</div></div></div>
  ${sty.n<3?`<div class="empty">Ho analizzato ${sty.n} ${sty.n===1?'seduta':'sedute'}: ne servono almeno 3 scritte o modificate da te. Le sedute generate e non toccate non contano, perché sono già "mie".</div>`
  :`<div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
     <div class="tile"><div class="eyebrow">Sedute analizzate</div><div class="v">${sty.n}</div><div class="s">${sty.done} svolte (pesano di più)</div></div>
     <div class="tile"><div class="eyebrow">Volume tipico</div><div class="v">${km(sty.vol)}<small>km</small></div><div class="s">proposto come volume di partenza</div></div>
     <div class="tile"><div class="eyebrow">Serie combinate</div><div class="v">${sty.mainN?Math.round(sty.combo/sty.mainN*100):0}<small>%</small></div><div class="s">centrali con giri o distanze miste</div></div>
     <div class="tile"><div class="eyebrow">Serie in archivio</div><div class="v">${mineN}</div><div class="s">riusate e riadattate al volume</div></div></div>
   <div style="display:flex;flex-direction:column;gap:8px;margin-top:14px;font-size:.88rem">
     ${dl?`<div><span class="muted">Distanze che usi di più:</span> <span class="btns" style="display:inline-flex">${dl}</span></div>`:''}
     ${kd?`<div><span class="muted">Quota del volume totale:</span> ${kd}</div>`:''}
     ${nm?`<div><span class="muted">I tuoi nomi dei blocchi:</span> ${nm}</div>`:''}
     <div><span class="muted">Affidabilità:</span> <span class="distbar" style="display:inline-flex;width:140px;vertical-align:middle"><i style="flex:${sty.conf};background:var(--ok)"></i><i style="flex:${1-sty.conf+0.0001};background:transparent"></i></span> <span class="muted">${sty.conf<1?`cresce fino a 12 sedute`:'piena'}</span></div></div>`}
  <label class="field" style="margin-top:16px"><span>Quanto seguire il mio stile: <b class="num" id="styv">${uv}%</b></span><input type="range" class="slider" id="s-styleUse" data-s="styleUse" min="0" max="100" step="10" value="${uv}"></label>
  <p class="muted" style="font-size:.8rem;margin-top:4px">0% = solo la libreria FASTLANE (piramidi, scale, giri, spezzati, progressivi…). Le strutture usate negli ultimi 10 giorni vengono evitate per non ripetere sempre lo stesso lavoro.</p>
  <div style="margin-top:14px"><h3 style="margin-bottom:8px">Serie preferite <span class="muted" style="font-size:.85rem;font-family:var(--f-body);font-weight:500">· salvale con ☆ nell'editor</span></h3>
  ${favs.length?`<div class="list">${favs.map(f=>`<div class="li" style="cursor:default">${andChip(f.a,'')}<span style="min-width:0"><div class="t">${esc(f.name)}</div><div class="sub mono">${esc((f.rounds>1?f.rounds+' x (':'')+f.rows.map(r=>(r.reps>1?r.reps+'x':'')+r.dist+' '+(r.and||'')).join(' + ')+(f.rounds>1?')':''))}</div></span><button class="icon" data-act="fav-del" data-id="${f.id}" aria-label="Rimuovi dai preferiti">×</button></div>`).join('')}</div>`:'<div class="empty">Nessuna serie preferita. Nell\'editor premi ☆ su un blocco: il generatore la riproporrà spesso, adattata al volume.</div>'}</div></div>`}

/* ---------- ANDATURE ---------- */
function vAnd(){
  const t=today();const g=goalRace(t);const d=V.guideDays!=null?V.guideDays:(g?diffDays(t,g.date):60);
  const fake={ph:PHASES.find(p=>d>=p.from&&d<=p.to)||PHASES[PHASES.length-1],days:d,race:g};const ath=athById(S.settings.ath);
  return `<div class="card-h"><h1>Andature</h1></div>
  <div class="card"><div class="phase-box"><div style="text-align:center"><div class="phase-days" style="color:${fake.ph.col}">${d}</div><div class="eyebrow">giorni alla gara</div></div>
   <div style="min-width:0;display:flex;flex-direction:column;gap:8px"><h2>${fake.ph.name}</h2><p class="muted" style="font-size:.9rem">${fake.ph.desc}</p>
   <input type="range" class="slider" id="gdays" data-bind="guideDays" min="0" max="140" value="${Math.min(140,d)}" aria-label="Giorni alla gara">

function laneGroups(w){const as=S.athletes.filter(a=>Object.keys(a.times||{}).length||Object.keys(a.timesLC||{}).length);
  const g=grpById(w&&w.group);if(g){const ga=as.filter(a=>a.group===g.id);return{byLane:false,list:ga.slice(0,8).map(a=>{const n=(a.name||'?').replace(/\s*\(esempio\)/,'');return{key:a.id,label:n,short:n.split(' ')[0],ath:[a]}})}}
  if(grps().length){const L=grps().map(x=>({key:x.id,label:grpLanes(x)||grpName(x),short:(x.lanes?'C'+String(x.lanes).replace(/\s/g,''):grpName(x).slice(0,4)),ath:as.filter(a=>a.group===x.id)})).filter(x=>x.ath.length);if(L.length)return{byLane:true,list:L}}
  const wl=as.filter(a=>a.lane);
  if(wl.length){const g={};wl.forEach(a=>{(g[a.lane]=g[a.lane]||[]).push(a)});return{byLane:true,list:Object.keys(g).sort((x,y)=>x-y).map(k=>({key:k,label:'Corsia '+k,short:'C'+k,ath:g[k]}))}}
  return{byLane:false,list:as.slice(0,6).map(a=>{const n=(a.name||'?').replace(/\s*\(esempio\)/,'');return{key:a.id,label:n,short:n.split(' ')[0],ath:[a]}})}}
function laneVal(r,w,grp){const wc=pa(w);let wt=0,snd=0,any=false;const base=workTime(wc,r);const ao=r.send?autoSend(r,wc):null;
  for(const a of grp.ath){const c=withPool(a,(w&&w.pool)||S.settings.pool||25);c._rf=prof(a.id).restF;const t=workTime(c,r);if(t==null)continue;any=true;wt=Math.max(wt,t);
    if(r.send){const x=(ao===r.send)?autoSend(r,c):Math.max(5,Math.round((r.send+(t-(base||t)))/5)*5);if(x)snd=Math.max(snd,x)}}
  return any?{wt,snd:snd||null}:null}
function lanesCard(w){const G=laneGroups(w);if(G.list.length<2)return '';const L=G.list;
  return `<div class="card"><div class="card-h"><div><h3>${grpById(w.group)?'Ripartenze per atleta':'Ripartenze per corsia'}</h3><div class="muted" style="font-size:.82rem">${grpById(w.group)?`Ripartenze personali per gli atleti di ${esc(grpLanes(grpById(w.group))||grpName(grpById(w.group)))}.`:`Stessa seduta per tutti, ripartenze calcolate sull'atleta più lento di ogni ${G.byLane?'corsia':'atleta'}${G.byLane?'':' (crea i gruppi in «Corsie» per raggruppare)'}.`}</div></div><button class="btn sm" data-act="copy-lanes" data-id="${w.id}">Copia per corsie</button></div>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Serie</th>${L.map(g=>`<th class="num">${esc(g.label)}</th>`).join('')}</tr></thead><tbody>
  ${w.blocks.map(b=>`<tr><td colspan="${L.length+1}" style="background:var(--surface2);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)">${esc(b.name)}${(+b.rounds||1)>1?` · ${b.rounds} giri`:''}</td></tr>`+b.rows.filter(r=>+r.reps&&+r.dist).map(r=>`<tr><td class="mono" style="white-space:normal">${esc(rowText({...r,note:'',send:null}))}</td>${L.map(g=>{const v=laneVal(r,w,g);return `<td class="num">${v?(v.snd?`<b>@${fmtSend(v.snd)}</b>`:`<span class="muted">${fmtSwim(v.wt)}</span>`):'—'}</td>`}).join('')}</tr>`).join('')).join('')}
  </tbody></table></div></div>`}
function wTextLanes(w){const G=laneGroups(w);const L=G.list;if(L.length<2)return wText(w);
  return `Ripartenze: ${L.map(g=>g.label).join(' / ')}\n\n`+w.blocks.map(b=>{const rd=+b.rounds||1;return b.name.toUpperCase()+(rd>1?` x${rd}`:'')+':\n'+b.rows.map(r=>{const vs=L.map(g=>laneVal(r,w,g));const tx=rowText({...r,send:null,note:''});const sd=vs.some(v=>v&&v.snd)?' @'+vs.map(v=>v&&v.snd?fmtSend(v.snd):'—').join('/'):'';return (rd>1?'  ':'')+tx+sd+(r.note?' '+r.note:'')}).join('\n')}).join('\n\n')}

function clockSVG(work,send){const R=78,C=100;const P=f=>[C+R*Math.sin(f*2*Math.PI),C-R*Math.cos(f*2*Math.PI)];
  const arc=(f0,f1,col)=>{if(f1-f0<=0.001)return '';if(f1-f0>=0.999)return `<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="${col}" stroke-width="9"/>`;const[x0,y0]=P(f0),[x1,y1]=P(f1);return `<path d="M${x0.toFixed(2)} ${y0.toFixed(2)}A${R} ${R} 0 ${f1-f0>.5?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}" fill="none" stroke="${col}" stroke-width="9"/>`};
  let g=`<circle cx="${C}" cy="${C}" r="${R+14}" fill="var(--surface2)" stroke="var(--line)"/>`;
  for(let i=0;i<60;i++){const a=i/60*2*Math.PI,r1=i%5?R+8:R+4;g+=`<line x1="${(C+r1*Math.sin(a)).toFixed(2)}" y1="${(C-r1*Math.cos(a)).toFixed(2)}" x2="${(C+(R+12)*Math.sin(a)).toFixed(2)}" y2="${(C-(R+12)*Math.cos(a)).toFixed(2)}" stroke="var(--muted)" stroke-width="${i%5?1:2}"/>`}
  const fw=Math.min(1,work/send);g+=arc(0,fw,'var(--accent)')+arc(fw,1,'var(--b2)');
  [0,1,2,3].forEach(q=>{const a=q/4*2*Math.PI;g+=`<text x="${(C+(R-22)*Math.sin(a)).toFixed(2)}" y="${(C-(R-22)*Math.cos(a)+4).toFixed(2)}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)" font-family="JetBrains Mono,monospace">${q?fmtSend(send*q/4):'0'}</text>`});
  const ha=fw*2*Math.PI;g+=`<line x1="${C}" y1="${C}" x2="${(C+(R-6)*Math.sin(ha)).toFixed(2)}" y2="${(C-(R-6)*Math.cos(ha)).toFixed(2)}" stroke="var(--race)" stroke-width="3" stroke-linecap="round"/><circle cx="${C}" cy="${C}" r="5" fill="var(--race)"/>`;
  return `<svg viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Ciclo di ripartenza: nuoto ${fmtSend(work)}, riparti a ${fmtSend(send)}">${g}</svg>`}
function calcOut(a,c){const r={dist:+c.dist,st:c.st,kind:'N',and:c.and,reps:2};const w=workTime(a,r);const s=sendoff(w,c.and);
  return `<div class="clockbox">${clockSVG(w,s)}<div style="display:flex;flex-direction:column;gap:10px"><div><div class="eyebrow">Tempo obiettivo</div><div class="bigt num" style="color:var(--accent)">${fmtSwim(w)}</div></div><div><div class="eyebrow">Ripartenza</div><div class="bigt num">@${fmtSend(s)}</div></div><p class="muted" style="font-size:.85rem">${c.dist} ${STROKES[c.st].toLowerCase()} in ${c.and}: recupero di circa ${fmtSend(s-w)}. Recuperi tipici ${c.and}: ${AI[c.and].rec}.</p><div class="legend" style="margin-top:0"><span style="--c:var(--accent)"><i></i>nuoto</span><span style="--c:var(--b2)"><i></i>recupero</span></div></div></div>`}

function confirmSheet(msg,label,fn){V._confirm=fn;openSheet(`<h2>${msg}</h2><div class="btns" style="justify-content:flex-end"><button class="btn" data-act="sheet-close">Annulla</button><button class="btn pri" style="background:var(--race);border-color:var(--race)" data-act="confirm-yes">${label}</button></div>`)}

async function askCoach(){
  const q=($('#aiq')||{}).value;if(!q||!sampleFn||V.aiBusy)return;const out=$('#aiout');V.aiBusy=true;
  const t=today(),pi=phaseAt(t);const ath=athById(S.settings.ath);
  const wk=[0,1,2,3].map(i=>{const f=addDays(weekStart(t),-7*i);const x=sumDone(f,addDays(f,6));return `settimana dal ${f}: ${km(x.m)} km in ${x.n} sedute`}).join('; ');
  const dist={};S.workouts.filter(w=>w.done&&w.date>=addDays(t,-28)).forEach(w=>{const o=wByAnd(w);for(const k in o)dist[k]=(dist[k]||0)+o[k]});
  const ctx=`Oggi: ${t}. Fase: ${pi.ph.name}${pi.race?`, ${pi.days} giorni alla gara "${pi.race.name}" (importanza ${pi.race.imp})`:''}. Volume ultime settimane: ${wk}. Metri per andatura ultimi 28 giorni: ${ANDS.map(a=>`${a} ${dist[a]||0}`).join(', ')}.${ath?` Atleta: ${ageOf(ath)?ageOf(ath)+' anni ('+catOf(ath)+'), ':''}tempi vasca 25 m ${Object.entries(ath.times||{}).map(([k,v])=>k+' '+fmtRace(v)).join(', ')||'—'}; tempi vasca 50 m ${Object.entries(ath.timesLC||{}).map(([k,v])=>k+' '+fmtRace(v)).join(', ')||'—'}. Vasca abituale ${S.settings.pool||25} m.`:''} Prossime sedute: ${S.workouts.filter(w=>w.date>=t).sort((a,b)=>a.date<b.date?-1:1).slice(0,4).map(w=>`${w.date} ${w.title} ${wMeters(w)} m`).join('; ')||'nessuna'}.`;
  out.innerHTML='<div class="ai-out">Sto pensando…</div>';const box=out.firstChild;
  try{const r=await sampleFn(`Sei un allenatore esperto di nuoto master (adulti dai 20 anni in su, categorie FIN Master). Tieni conto dell'età, del recupero più lento e del tempo in vasca limitato; cura tecnica, virate e partenze. Usa la terminologia delle andature A1, A2, B1, B2, C1, C2, C3. Rispondi in italiano, in modo concreto e conciso (massimo 180 parole), con serie, distanze e ripartenze quando utile. Niente markdown pesante.\n\nDati dell'utente:\n${ctx}\n\nDomanda: ${q}`,{onText:({text})=>{box.textContent=text}});box.textContent=r.text}
  catch(e){if(e&&(e.code==='not_granted'||e.code==='sampling_disabled')){sampleFn=null;out.innerHTML='<div class="ai-out">Il coach AI non è disponibile per questo account. I consigli qui sopra restano attivi.</div>'}else box.textContent=(e&&e.text)||(e&&e.code==='rate_limited'?'Troppe richieste: riprova tra poco.':'Risposta interrotta. Riprova.')}
  finally{V.aiBusy=false}}

function authGate(state,info){let g=$('#gate');if(!g){g=document.createElement('div');g.id='gate';g.className='gate';document.body.appendChild(g)}
  if(!state){g.hidden=true;g.innerHTML='';return}

   login:'<p>App riservata. Accedi con il tuo account Google.</p><button class="btn pri" data-act="login" style="padding:14px 22px;font-size:1.05rem">Accedi con Google</button>',
   denied:`<p>L'account <b>${esc(info||'')}</b> non è autorizzato a usare questa app.</p><button class="btn" data-act="logout">Esci e cambia account</button>`,
   config:'<p>Configurazione mancante: inserisci i dati del progetto Firebase nel file <b>config.js</b>.</p>',
   error:`<p>Errore di accesso: ${esc(info||'')}</p><button class="btn" data-act="login">Riprova</button>`}[state]||'';
  g.innerHTML=`<div class="gate-box"><div class="logo" style="font-size:2.6rem">FAST<b>LANE</b></div><div class="lane" style="width:140px;margin:6px auto 18px"></div>${msg}</div>`;g.hidden=false}
async function initCloud(){

  authGate('loading');
  try{firebase.initializeApp(C.firebase);const auth=firebase.auth();const fs=firebase.firestore();
    try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
    try{await auth.getRedirectResult()}catch(e){}
    auth.onAuthStateChanged(u=>{
      if(!u){authGate('login');return}
      const ok=(C.owners||[]).map(x=>String(x).toLowerCase()).includes(String(u.email||'').toLowerCase())&&u.emailVerified;
      if(!ok){authGate('denied',u.email);return}
      authGate(null);db=fs;col=fs.collection('users/'+u.uid+'/data');
      col.onSnapshot(applySnap,()=>{mode='local';setSync()});
      if(V.tour!=null)renderTour()})}
  catch(e){authGate('error',e&&e.message)}}

  const dist={};S.workouts.filter(w=>w.done&&w.date>=addDays(t,-28)).forEach(w=>{const o=wByAnd(w);for(const k in o)dist[k]=(dist[k]||0)+o[k]});
  const ctx=`Oggi: ${t}. Fase: ${pi.ph.name}${pi.race?`, ${pi.days} giorni alla gara "${pi.race.name}"`:''}. Volume: ${wk}. Metri per andatura negli ultimi 28 giorni: ${ANDS.map(a=>`${a} ${dist[a]||0}`).join(', ')}.${ath&&ageOf(ath)?` Atleta di riferimento: ${ageOf(ath)} anni (${catOf(ath)}).`:''}${grps().length?` Corsie: ${grps().map(g=>`${grpLanes(g)||grpName(g)} ${GSPEC[g.spec||'mezzo'].n}`).join(', ')}.`:''}`;
  const prompt=`Sono un allenatore di nuoto master e uso le andature A1, A2, B1, B2, C1, C2, C3. Situazione: ${ctx}\n\nDomanda: ${q}`;
  window.open('https://claude.ai/new?q='+encodeURIComponent(prompt),'_blank','noopener')}
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}

(function boot(){
  const local=lsGet();
  if(local&&hasData(local)){S={settings:{...DEFSET,...local.settings},athletes:local.athletes||[],workouts:local.workouts||[],races:local.races||[],favs:local.favs||[],groups:local.groups||[]}}
  else{S={settings:{...DEFSET},athletes:[],workouts:[],races:[],favs:[],groups:[]};V.tour=0}
  const h=(location.hash||'').slice(1);if(['oggi','sedute','calendario','progressi','genera','andature','tecnica','corsie','atleti','impostazioni'].includes(h))V.view=h;
